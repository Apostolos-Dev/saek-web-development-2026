<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="utf-8">
    <title>Πολυμέσα</title>
</head>
<body>
    <h1>Πολυμέσα</h1>

    <!-- Ήχος από τον υποφάκελο media -->
    <h2>Ήχος</h2>
    <p>Ένας σύντομος δοκιμαστικός τόνος.</p>
    <audio controls>
        <source src="media/sound.mp3" type="audio/mpeg">
        Ο browser δεν υποστηρίζει την ετικέτα audio.
    </audio>
    <p><a href="media/sound.mp3">Άνοιγμα αρχείου ήχου</a></p>

    <!-- Βίντεο με εικόνα προεπισκόπησης -->
    <h2>Βίντεο</h2>
    <p>Δοκιμαστικά σχήματα χωρίς ομιλία.</p>
    <video controls width="320" height="180" poster="media/poster.png">
        <source src="media/video.mp4" type="video/mp4">
        Ο browser δεν υποστηρίζει την ετικέτα video.
    </video>
    <p><a href="media/video.mp4">Άνοιγμα αρχείου βίντεο</a></p>
</body>
</html>
