<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="utf-8" />
    <title>Ο Πίνακάς μου</title>
    <!-- Ενσωμάτωση CSS για να φαίνονται τα περιγράμματα του πίνακα -->
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <!-- Ξεκινάει ο πίνακας -->
    <table>
        <!-- 1η Γραμμή: Κελιά Επικεφαλίδων (Table Headers) -->
        <tr>
            <th>Όνομα</th>
            <th>Βαθμός</th>
        </tr>
        
        <!-- 2η Γραμμή: Κελιά Δεδομένων (Table Data) -->
        <tr>
            <td>Νίκος</td>
            <td>10</td>
        </tr>
    </table>
</body>
</html>
