<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="utf-8" />
    <title>Εικόνες και Σύνδεσμοι</title>
</head>
<body>
    <!-- Εισαγωγή εικόνας (Κενή ετικέτα, δεν έχει κλείσιμο) -->
    <img src="photo.jpg" alt="Μια φωτογραφία" />

    <!-- Αλλαγή γραμμής (Κενή ετικέτα) -->
    <br />

    <!-- Σύνδεσμος. Το target="_blank" τον ανοίγει σε νέα καρτέλα -->
    <a href="https://www.google.com" target="_blank">Google</a>
</body>
</html>
