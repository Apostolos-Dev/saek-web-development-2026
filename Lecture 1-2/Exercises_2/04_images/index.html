<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Εικόνες HTML</title>
</head>
<body>
<h1>Εικόνες</h1>
<figure><img src="images/structure.png" alt="Περιοχές header, nav, main και footer" width="289" height="282">
<figcaption>Ένα απλό διάγραμμα δομής.</figcaption></figure>
<h2>Αλλαγή εικόνας με picture</h2>
<p>Μεταβάλετε το πλάτος του παραθύρου πάνω και κάτω από 900 pixels.</p>
<picture><source media="(min-width: 900px)" srcset="images/wide.png">
<img src="images/compact.png" alt="Διάγραμμα σημασιολογικών περιοχών"></picture>
</body>
</html>
